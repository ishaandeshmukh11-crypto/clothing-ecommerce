# One-command local / VPS setup:  docker compose up -d --build
# Then seed once:                  docker compose exec backend node src/seed.js
services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - mongo-data:/data/db

  backend:
    build: ./backend
    restart: unless-stopped
    env_file: ./backend/.env
    environment:
      MONGODB_URI: mongodb://mongo:27017/clothing_store
    ports:
      - "5000:5000"
    volumes:
      - uploads:/app/uploads
    depends_on:
      - mongo

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:5000}
        NEXT_PUBLIC_SITE_URL: ${NEXT_PUBLIC_SITE_URL:-http://localhost:3000}
    restart: unless-stopped
    environment:
      API_URL_INTERNAL: http://backend:5000
    ports:
      - "3000:3000"
    depends_on:
      - backend

volumes:
  mongo-data:
  uploads:
